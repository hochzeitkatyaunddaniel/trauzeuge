<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ein Angebot, das du nicht ablehnen kannst</title>
    <style>
        /* Einbindung der passenden Plakat-Schriftart im Godfather-Stil */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700;900&display=swap');

        body {
            background-color: #0b0b0b;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Times New Roman', serif;
            overflow-x: hidden;
        }

        .poster-wrapper {
            position: relative;
            max-width: 550px;
            width: 100%;
            border: 3px solid #dfbc5b; /* Angepasster Goldton für den Rahmen */
            box-shadow: 0 0 25px rgba(223, 188, 91, 0.35);
            background-color: #111;
        }

        .poster-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Die interaktiven Buttons – perfekt platziert im erweiterten Bereich */
        .overlay-buttons {
            position: absolute;
            bottom: 7%; 
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }

        .btn-option {
            background: rgba(15, 15, 15, 0.95);
            /* Exakter, warmer Goldton passend zum Plakat-Text */
            color: #dfbc5b; 
            border: 2px solid #dfbc5b;
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            font-family: 'Cinzel Decorative', 'Cinzel', 'Times New Roman', serif;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        .btn-option:hover {
            background: #dfbc5b;
            color: #111111;
            text-shadow: none;
        }

        #btn-nein {
            position: relative;
            transition: transform 0.1s ease-out;
        }

        /* Spezielle Anpassung für Smartphones (kleinere Bildschirme) */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .poster-wrapper {
                border: none;
                box-shadow: none;
            }
            .overlay-buttons {
                bottom: 6.5%; 
                width: 90%;
            }
            .btn-option {
                padding: 8px 12px;
                font-size: 0.85rem;
                letter-spacing: 1px;
            }
        }

        /* Modal nach erfolgreicher Bestätigung */
        #success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #success-modal h2 {
            font-size: 2.3rem;
            color: #dfbc5b;
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            text-shadow: 0 0 15px rgba(223, 188, 91, 0.5);
            text-transform: uppercase;
        }

        #success-modal p {
            font-size: 1.1rem;
            color: #f0f0f0;
            max-width: 500px;
            line-height: 1.6;
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body>

    <div class="poster-wrapper">
        <!-- Dein finales Poster -->
        <img src="poster.jfif" alt="Wirst du mein Trauzeuge?" class="poster-img">

        <!-- Die interaktiven Antwortmöglichkeiten -->
        <div class="overlay-buttons">
            <button class="btn-option" id="btn-ja" onclick="showAccept()">☐ JA, ICH AKZEPTIERE</button>
            <button class="btn-option" id="btn-nein">☐ ICH WÄHLE DIE SCHANDE (NEIN)</button>
        </div>
    </div>

    <div id="success-modal">
        <h2>Die Familie dankt dir.</h2>
        <p>Ein Angebot, das er nicht ablehnen konnte. Der Bund für die Ewigkeit ist besiegelt! 🥃🎩</p>
    </div>

    <script>
        const neinBtn = document.getElementById('btn-nein');

        function moveButton(e) {
            if (e) e.preventDefault();

            let randomX, randomY;
            do {
                randomX = (Math.random() - 0.5) * 260; 
                randomY = (Math.random() - 0.5) * 140; 
            } while (Math.abs(randomX) < 80 && Math.abs(randomY) < 40);

            neinBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // Lauscht auf Maus (PC) und Touch-Gesten (Smartphone)
        neinBtn.addEventListener('mouseenter', moveButton);
        neinBtn.addEventListener('touchstart', moveButton, { passive: false });
        neinBtn.addEventListener('click', moveButton);

        function showAccept() {
            document.getElementById('success-modal').style.display = 'flex';
        }
    </script>

</body>
</html>
