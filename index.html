<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ein Angebot, das du nicht ablehnen kannst</title>
    <style>
        body {
            background-color: #111111;
            color: #d4af37; /* Edles Gold */
            font-family: 'Times New Roman', Times, serif, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        h2 {
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 40px;
            color: #f3e5ab;
        }

        .image-container {
            margin-bottom: 30px;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border: 2px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .button-group {
            position: relative;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 20px;
        }

        .btn {
            background-color: #1a1a1a;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s, color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .btn:hover {
            background-color: #d4af37;
            color: #111111;
        }

        #btn-nein {
            position: absolute;
            transition: all 0.1s ease;
        }

        /* Modal / Erfolgsnachricht */
        #success-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #success-message h2 {
            font-size: 3rem;
            color: #d4af37;
            text-shadow: 0 0 10px #d4af37;
            margin-bottom: 20px;
        }

        #success-message p {
            font-size: 1.5rem;
            color: #ffffff;
            max-width: 600px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>Ein Angebot, das du nicht ablehnen kannst.</h1>
        <h2>Wirst du mein Trauzeuge?</h2>

        <!-- Falls du das Bild direkt online hosten oder einbinden willst, kannst du hier die URL anpassen -->
        <div class="image-container">
            <img src="IMG_1185.JPG" alt="Der Pate - Trauzeuge Anfrage">
        </div>

        <div class="button-group" id="button-group">
            <button class="btn" id="btn-ja" onclick="accepted()">☐ Ja, ich akzeptiere</button>
            <button class="btn" id="btn-nein" onmouseover="moveButton()" onclick="moveButton()">☐ Ich wähle die Schande (Nein)</button>
        </div>
    </div>

    <div id="success-message">
        <h2>Die Familie dankt dir.</h2>
        <p>Du hast das richtige Angebot gewählt. Der Deal besiegelt den Bund fürs Leben! 🥃</p>
    </div>

    <script>
        const neinBtn = document.getElementById('btn-nein');
        const buttonGroup = document.getElementById('button-group');

        function moveButton() {
            // Berechne zufällige Positionen innerhalb des sichtbaren Bereichs oder des Containers
            const maxX = window.innerWidth - neinBtn.offsetWidth - 50;
            const maxY = window.innerHeight - neinBtn.offsetHeight - 50;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            neinBtn.style.position = 'fixed';
            neinBtn.style.left = randomX + 'px';
            neinBtn.style.top = randomY + 'px';
        }

        function accepted() {
            document.getElementById('success-message').style.display = 'flex';
        }
    </script>

</body>
</html>
