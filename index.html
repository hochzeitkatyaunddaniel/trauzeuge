<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ein Angebot, das du nicht ablehnen kannst</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        body {
            background-color: #0b0b0b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Times New Roman', serif;
            overflow: hidden; /* Verhindert Scrollbalken beim Springen */
        }

        .poster-wrapper {
            position: relative;
            max-width: 600px;
            width: 100%;
            border: 3px solid #d4af37;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
            background-color: #111;
        }

        .poster-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Die interaktiven Buttons, positioniert im erweiterten schwarzen Bereich */
        .overlay-buttons {
            position: absolute;
            bottom: 8%; 
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }

        .btn-option {
            background: rgba(18, 18, 18, 0.95);
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            font-family: 'Cinzel', 'Times New Roman', serif;
            transition: background 0.2s, color 0.2s;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-option:hover {
            background: #d4af37;
            color: #111111;
        }

        #btn-nein {
            /* Wird dynamisch per JS gesteuert, sobald die Flucht beginnt */
            transition: none; 
        }

        /* Modal nach erfolgreicher Bestätigung */
        #success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #success-modal h2 {
            font-size: 2.8rem;
            color: #d4af37;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            text-transform: uppercase;
        }

        #success-modal p {
            font-size: 1.3rem;
            color: #f0f0f0;
            max-width: 550px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="poster-wrapper">
        <!-- Das finale Poster mit erweitertem schwarzem Bereich -->
        <img src="poster.jfif" alt="Wirst du mein Trauzeuge?" class="poster-img">

        <!-- Die Antwortmöglichkeiten als dynamische Buttons -->
        <div class="overlay-buttons">
            <button class="btn-option" id="btn-ja" onclick="showAccept()">☐ JA, ICH AKZEPTIERE</button>
            <button class="btn-option" id="btn-nein">☐ ICH WÄHLE DIE SCHANDE (NEIN)</button>
        </div>
    </div>

    <div id="success-modal">
        <h2>Die Familie dankt dir.</h2>
        <p>Ein Angebot, das er nicht ablehnen konnte. Der Bund für die Ewigkeit ist besiegelt! 🥃🎩</p>
    </div>

    <script>
        const neinBtn = document.getElementById('btn-nein');

        function moveButton(e) {
            if (e) e.preventDefault(); // Verhindert Standard-Klicks/Taps auf dem Nein-Button

            // Wenn der Button noch im normalen Layout war, fixieren wir seine anfängliche Größe und Position
            if (neinBtn.style.position !== 'fixed') {
                const rect = neinBtn.getBoundingClientRect();
                neinBtn.style.position = 'fixed';
                neinBtn.style.left = rect.left + 'px';
                neinBtn.style.top = rect.top + 'px';
                neinBtn.style.width = rect.width + 'px';
            }

            // Sicherheitsabstand zum Rand, damit er nie abgeschnitten wird
            const padding = 30;
            const maxX = window.innerWidth - neinBtn.offsetWidth - padding;
            const maxY = window.innerHeight - neinBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            neinBtn.style.left = randomX + 'px';
            neinBtn.style.top = randomY + 'px';
            neinBtn.style.zIndex = '99999';
        }

        // Lauscht auf Maus (PC) und Touch (Smartphone/Tablet)
        neinBtn.addEventListener('mouseover', moveButton);
        neinBtn.addEventListener('touchstart', moveButton, { passive: false });
        neinBtn.addEventListener('click', moveButton);

        function showAccept() {
            document.getElementById('success-modal').style.display = 'flex';
        }
