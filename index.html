<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ein Angebot, das du nicht ablehnen kannst</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        body {
            background-color: #080808;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Times New Roman', serif;
        }

        .poster-wrapper {
            position: relative;
            max-width: 600px;
            width: 100%;
            border: 3px solid #d4af37;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
            background-color: #111;
        }

        .poster-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Overlay für die interaktiven Knöpfe genau auf dem Poster */
        .overlay-buttons {
            position: absolute;
            bottom: 12%; /* Platzierung exakt im freien dunklen Bereich */
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }

        .btn-option {
            background: rgba(15, 15, 15, 0.9);
            color: #d4af37;
            border: 1.5px solid #d4af37;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            font-family: 'Cinzel', 'Times New Roman', serif;
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }

        .btn-option:hover {
            background: #d4af37;
            color: #0a0a0a;
        }

        #btn-nein {
            transition: all 0.12s ease-out;
        }

        /* Modal nach erfolgreicher Bestätigung */
        #success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #success-modal h2 {
            font-size: 2.8rem;
            color: #d4af37;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        #success-modal p {
            font-size: 1.3rem;
            color: #f0f0f0;
            max-width: 550px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="poster-wrapper">
        <!-- Das erstelle Poster-Bild -->
        <img src="IMG_1185.jfif" alt="Der Pate - Wirst du mein Trauzeuge?" class="poster-img">

        <!-- Interaktive Buttons auf der dafür reservierten Fläche -->
        <div class="overlay-buttons">
            <button class="btn-option" id="btn-ja" onclick="showAccept()">☐ JA, ICH AKZEPTIERE</button>
            <button class="btn-option" id="btn-nein" onmouseover="escapeButton()" ontouchstart="escapeButton()" onclick="escapeButton()">☐ ICH WÄHLE DIE SCHANDE (NEIN)</button>
        </div>
    </div>

    <div id="success-modal">
        <h2>DIE FAMILIE DANKT DIR.</h2>
        <p>Eine Entscheidung voller Ehre. Der Bund ist besiegelt! 🥃🎩</p>
    </div>

    <script>
        const neinBtn = document.getElementById('btn-nein');

        function escapeButton() {
            const margin = 50;
            const maxX = window.innerWidth - neinBtn.offsetWidth - margin;
            const maxY = window.innerHeight - neinBtn.offsetHeight - margin;

            const randomX = Math.max(margin, Math.floor(Math.random() * maxX));
            const randomY = Math.max(margin, Math.floor(Math.random() * maxY));

            neinBtn.style.position = 'fixed';
            neinBtn.style.left = randomX + 'px';
            neinBtn.style.top = randomY + 'px';
            neinBtn.style.zIndex = '999';
        }

        function showAccept() {
            document.getElementById('success-modal').style.display = 'flex';
        }
    </script>

</body>
</html>
