<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ein Angebot, das du nicht ablehnen kannst</title>
    <style>
        /* Einbindung der passenden Plakat-Schriftart im Godfather-Stil */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700;900&display=swap');

        body {
            background-color: #0b0b0b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Times New Roman', serif;
            overflow: hidden;
        }

        .poster-wrapper {
            position: relative;
            max-width: 600px;
            width: 100%;
            border: 3px solid #d4af37;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
            background-color: #111;
        }

        .poster-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Die interaktiven Buttons im exakten Plakat-Stil */
        .overlay-buttons {
            position: absolute;
            bottom: 8%; 
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            z-index: 10;
        }

        .btn-option {
            background: rgba(15, 15, 15, 0.95);
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 12px 20px;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            /* Exakte, wuchtige Plakat-Schriftart */
            font-family: 'Cinzel Decorative', 'Cinzel', 'Times New Roman', serif;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-option:hover {
            background: #d4af37;
            color: #111111;
        }

        #btn-nein {
            position: relative;
            transition: transform 0.08s ease-out; /* Lässt den Button geschmeidig wegspringen */
        }

        /* Modal nach erfolgreicher Bestätigung */
        #success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #success-modal h2 {
            font-size: 2.8rem;
            color: #d4af37;
            margin-bottom: 20px;
            letter-spacing: 2px;
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            text-transform: uppercase;
        }

        #success-modal p {
            font-size: 1.3rem;
            color: #f0f0f0;
            max-width: 550px;
            line-height: 1.6;
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body>

    <div class="poster-wrapper">
        <!-- Das finale Poster -->
        <img src="poster.jpg" alt="Wirst du mein Trauzeuge?" class="poster-img">

        <!-- Die Antwortmöglichkeiten -->
        <div class="overlay-buttons">
            <button class="btn-option" id="btn-ja" onclick="showAccept()">☐ JA, ICH AKZEPTIERE</button>
            <button class="btn-option" id="btn-nein">☐ ICH WÄHLE DIE SCHANDE (NEIN)</button>
        </div>
    </div>

    <div id="success-modal">
        <h2>Die Familie dankt dir.</h2>
        <p>Ein Angebot, das er nicht ablehnen konnte. Der Bund für die Ewigkeit ist besiegelt! 🥃🎩</p>
    </div>

    <script>
        const neinBtn = document.getElementById('btn-nein');

        function moveButton(e) {
            if (e) e.preventDefault();

            // Kontrollierter kleiner Radius direkt um die Ursprungsposition herum
            const randomX = (Math.random() - 0.5) * 240; // max. 120px nach links/rechts
            const randomY = (Math.random() - 0.5) * 120; // max. 60px nach oben/unten

            neinBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // Lauscht zuverlässig auf Mauszeiger (PC) und Touch-Gesten (Smartphone)
        neinBtn.addEventListener('mouseenter', moveButton);
        neinBtn.addEventListener('touchstart', moveButton, { passive: false });
        neinBtn.addEventListener('click', moveButton);

        function showAccept() {
            document.getElementById('success-modal').style.display = 'flex';
        }
    </script>

</body>
</html>
