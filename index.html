<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ein Angebot, das du nicht ablehnen kannst</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .poster-container {
            max-width: 650px;
            width: 100%;
            background-color: #111;
            border: 3px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        .poster-container img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #333;
        }

        .interaction-area {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            position: relative;
            min-height: 120px;
        }

        .btn {
            background-color: #1a1a1a;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s, color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.7);
            font-family: 'Times New Roman', Times, serif, sans-serif;
        }

        .btn:hover {
            background-color: #d4af37;
            color: #111111;
        }

        #btn-nein {
            position: relative;
            transition: all 0.1s ease-out;
        }

        /* Modal / Erfolgsnachricht im Mafia-Stil */
        #success-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #success-message h2 {
            font-size: 2.8rem;
            color: #d4af37;
            text-shadow: 0 0 15px #d4af37;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        #success-message p {
            font-size: 1.4rem;
            color: #ffffff;
            max-width: 600px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Das Bild, das als Plakat dient -->
        <img src="IMG_1185.JPG" alt="Der Pate - Trauzeuge Anfrage">
        
        <div class="interaction-area" id="interactionArea">
            <button class="btn" id="btn-ja" onclick="accepted()">☐ Ja, ich akzeptiere</button>
            <button class="btn" id="btn-nein" onmouseover="moveButton()" ontouchstart="moveButton()" onclick="moveButton()">☐ Ich wähle die Schande (Nein)</button>
        </div>
    </div>

    <div id="success-message">
        <h2>Die Familie dankt dir.</h2>
        <p>Ein Angebot, das er offensichtlich nicht ablehnen konnte. Der Bund fürs Leben ist besiegelt! 🥃🎩</p>
    </div>

    <script>
        const neinBtn = document.getElementById('btn-nein');

        function moveButton() {
            // Lässt den Nein-Button zufällig auf dem Bildschirm wegspringen
            const maxX = window.innerWidth - neinBtn.offsetWidth - 40;
            const maxY = window.innerHeight - neinBtn.offsetHeight - 40;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            neinBtn.style.position = 'fixed';
            neinBtn.style.left = randomX + 'px';
            neinBtn.style.top = randomY + 'px';
            neinBtn.style.zIndex = '50';
        }

        function accepted() {
            document.getElementById('success-message').style.display = 'flex';
        }
    </script>

</body>
</html>
